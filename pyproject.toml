[project]
name = "expman"
version = "0.1.0"
description = "An experiment workbench for TensorBoard logs, configurations, and time-series analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "plotly>=6,<7",
    "pyyaml>=6,<7",
    "setuptools>=65,<81",
    "starlette>=0.40,<0.53",
    "tensorboard>=2.19,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
expman = "expman.cli:main"

[project.urls]
Repository = "https://github.com/HorizonRoboticsInternal/expman"
Issues = "https://github.com/HorizonRoboticsInternal/expman/issues"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expman"]

[tool.hatch.build.targets.wheel.force-include]
"docs/design.html" = "expman/design.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ui: real Chromium tests, enabled explicitly with --ui",
    "ui_scenario(name): select a deterministic browser-test dataset",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

name: Browser UI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - name: Install Chromium and system dependencies
        run: uv run --locked --with-requirements tests/ui/requirements.txt python -m playwright install --with-deps chromium
      - name: Exercise backend and actual browser workflows
        run: uv run --locked --with-requirements tests/ui/requirements.txt pytest --ui --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output test-results
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: chromium-ui-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
